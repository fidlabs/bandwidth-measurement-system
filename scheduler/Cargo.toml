[package]
name = "scheduler"
version = "1.1.1"
edition = "2021"
authors = ["Michał Mach <michal.mach@neti-soft.com>"]

[lib]
name = "scheduler"
path = "src/lib.rs"

[[bin]]
name = "scheduler"
path = "src/main.rs"

[dependencies]
amqprs = { version = "2.0.0", features = ["tls"] }
anyhow = "1.0.87"
async-trait = "0.1.82"
axum = { version = "0.7.5", features = ["macros", "tokio"] }
axum-extra = { version = "0.9.3" }
color-eyre = "0.6.3"
dotenvy = "0.15.7"
http-acl = "0.10"
http-acl-reqwest = "0.10"
once_cell = "1.19.0"
rabbitmq = { version = "1.1.1", path = "../rabbitmq" }
rand = "0.8.5"
reqwest = {version = "0.12.7", features = ["json"]}
reqwest-middleware = "0.4"
serde = {version = "1.0.209", features = ["derive"]}
serde_json = "1.0.128"
sqlx = { version = "0.8.2", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "json",
  "tls-rustls-aws-lc-rs",
  "chrono",
] }
tokio = { version = "1.40.0", features = ["full"] }
tower = "0.5.0"
tower-http = { version = "0.5.2", features = ["trace", "fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
url = "2.5.2"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
urlencoding = "2.1.3"
chrono = { version = "0.4.38", features = ["serde"] }
aws-sdk-ecs = "1.47.0"
aws-config = { version = "1.5.8", features = ["behavior-version-latest"] }
utoipa = { version = "5.2.0", features = ["axum_extras", "uuid", "url", "chrono", "debug"] }
utoipa-swagger-ui = {version = "8.0.3", features = ["axum", "reqwest", "url"]}
common = { version = "1.1.1", path = "../common" }
thiserror = "1.0"

[dev-dependencies]
sqlx-cli = "0.8.2"
tokio = { version = "1.40", features = ["full", "test-util"] }
wiremock = "0.6.5"
testcontainers = { version = "0.23", features = ["blocking"] }
testcontainers-modules = { version = "0.11", features = ["postgres", "rabbitmq"] }
axum-test = "15.7"  # Version compatible with axum 0.7
assert-json-diff = "2.0"
pretty_assertions = "1.4.1"
serial_test = "3.2"
tower = { version = "0.5.2", features = ["util"] }
hyper = "1.5"
futures = "0.3"
