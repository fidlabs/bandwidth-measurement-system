name: Manually trigger deploy to staging or production
run-name: "Manually deploy ${{ github.ref_name }} triggered by ${{ github.actor }}; version: ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Enter the version number"
        required: true
        type: string
        default: "main"
      environment:
        required: false
        description: "Select the environment to deploy to"
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version number"
        required: true
        default: "main"
      environment:
        required: false
        description: "Select the environment to deploy to"
        type: choice
        options:
          - production
          - staging
        default: staging

permissions:
  id-token: write
  contents: read

jobs:
  trigger-scheduler-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' && inputs.version != '' }}
    steps:
      - name: Trigger scheduler deploy
        uses: neti-filplus-infra/filplus-deploy-action@main
        with:
          version: ${{ inputs.version }}
          environment: ${{ inputs.environment }}
          ecr-repository: filplus-provider-benchmark
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IMAGE_DEPLOYER }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IMAGE_DEPLOYER }}
          aws-region: us-east-1

  trigger-workers-deploy:
    strategy:
      matrix:
        region:
          - us-east-1
          - ap-southeast-1
          - ap-east-1
          - eu-central-1
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' && inputs.version != '' }}
    steps:
      - name: Trigger ${{ matrix.region }} worker deploy
        uses: neti-filplus-infra/filplus-deploy-action@main
        with:
          version: ${{ inputs.version }}
          environment: ${{ inputs.environment }}
          ecr-repository: filplus-provider-benchmark-worker
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IMAGE_DEPLOYER }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IMAGE_DEPLOYER }}
          aws-region: ${{ matrix.region }}
